name: Cloud preview artifact
on:
  pull_request:
    paths:
      - "templates/**"
      - "scripts/**"
      - "package*.json"
      - "requirements-audio.txt"
      - ".github/workflows/cloud-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.cache/npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-audio.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libnss3 libatk-bridge2.0-0 libgbm1 libasound2t64
      - run: bash scripts/cloud-setup.sh
      - run: PATH="$PWD/.venv/bin:$PATH" npm run cloud:verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: animated-shorts-preview
          path: out/cloud-smoke/
          retention-days: 7
          if-no-files-found: error
